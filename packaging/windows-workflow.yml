# The Windows exe on a v* tag or by hand; public-<calc>.msp is attached by hand (see packaging/README.md).
name: windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo build --release -p ms-app --target x86_64-pc-windows-gnu
      - run: mv target/x86_64-pc-windows-gnu/release/maniascope.exe ManiaScope.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ManiaScope-windows
          path: ManiaScope.exe
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" ManiaScope.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
