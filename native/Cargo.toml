[package]
name = "maniascope_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "maniascope_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
rosu-pp = "4"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
