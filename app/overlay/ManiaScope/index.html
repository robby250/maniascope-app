<!doctype html>
<!-- ManiaScope's main window for tosu's in-game overlay: state.json comes from the app, playback from tosu. -->
<html>
<head>
<meta charset="utf-8">
<title>ManiaScope</title>
<style>
  html, body { margin: 0; background: transparent; }
  #card { width: 400px; padding: 10px; color: #eff0f1; font: 13px "Segoe UI", "Liberation Sans", Arial, sans-serif;
          background: rgba(32, 35, 38, .88); border-radius: 6px; }
  #card.empty { display: none; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .line, #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { font-weight: 700; font-size: 14px; }
  .dim { color: #a1a9b1; }
  #rating { font-size: 34px; font-weight: 700; line-height: 1.1; }
  #skills { min-height: 18px; }
  #skills span { margin-right: 8px; }
  #skills span:first-child { font-weight: 700; }
  #graph { display: block; width: 100%; height: 42px; margin: 4px 0; }
  #pick { border-top: 1px solid #4d5157; padding-top: 5px; }
  #pick b { color: #57c26e; }
  #expected { font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
<div id="card" class="empty">
  <div id="title"></div>
  <div class="line dim" id="version"></div>
  <div class="row">
    <div id="rating"></div>
    <div class="dim" id="context"></div>
    <div class="dim" id="nps"></div>
  </div>
  <div class="line" id="skills"></div>
  <canvas id="graph" width="380" height="42"></canvas>
  <div class="row"><div class="dim">Expected accuracy</div><div id="expected"></div></div>
  <div class="row" id="pick"><div class="line" id="pick_title"></div><b id="pick_rate"></b></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  let state = null, live = null, span = null, signature = '';

  function draw() {
    const canvas = $('graph'), cr = canvas.getContext('2d'), points = state && state.timeline;
    cr.clearRect(0, 0, canvas.width, canvas.height);
    if (!points || !points.length) return;
    const w = canvas.width, h = canvas.height, top = Math.max(...points) * 1.05 || 1;
    cr.beginPath();
    cr.moveTo(0, h);
    points.forEach((v, i) => cr.lineTo(i * w / Math.max(1, points.length - 1), h - h * v / top));
    cr.lineTo(w, h);
    cr.closePath();
    cr.fillStyle = 'rgba(239, 240, 241, .35)';
    cr.fill();
    if (live !== null && span && span[1] > span[0]) {
      const x = w * Math.min(1, Math.max(0, (live - span[0]) / (span[1] - span[0])));
      cr.save();
      cr.clip();
      cr.fillStyle = 'rgba(54, 133, 227, .9)';
      cr.fillRect(0, 0, x, h);
      cr.restore();
    }
  }

  function show(s) {
    state = s;
    $('card').classList.toggle('empty', !s.title);
    $('title').textContent = [s.title, s.artist].filter(Boolean).join('  ·  ');
    $('version').textContent = s.version || '';
    $('rating').textContent = s.rating == null ? '–' : s.rating.toFixed(1);
    $('context').textContent = s.context || '';
    $('nps').textContent = s.nps == null ? '' : `${s.nps.toFixed(1)} NPS · LN ${s.ln}%`;
    $('skills').replaceChildren(...(s.skills || []).map(k => {
      const e = document.createElement('span');
      e.textContent = `${k.name} ${k.rating.toFixed(1)}`;
      return e;
    }));
    $('expected').textContent = s.expected || '–';
    $('pick').style.display = s.pick ? '' : 'none';
    $('pick_title').textContent = s.pick ? s.pick.title : '';
    $('pick_rate').textContent = s.pick ? `${s.pick.set}  ${s.pick.expected}` : '';
    draw();
  }

  async function refresh() {
    try {
      const reply = await fetch(`state.json?${Date.now()}`, { cache: 'no-store' });
      if (reply.ok) show(await reply.json());
    } catch (e) { /* ManiaScope has not written one yet */ }
  }

  function connect() {
    const socket = new WebSocket(`ws://${location.host}/websocket/v2`);
    socket.onmessage = event => {
      const d = JSON.parse(event.data), time = d.beatmap && d.beatmap.time;
      const playing = d.state && d.state.name && d.state.name.toLowerCase() === 'play';
      live = playing && time ? time.live : null;
      span = time ? [time.firstObject, time.lastObject] : null;
      draw();
      // The app writes a moment after the game changes.
      const now = `${d.beatmap && d.beatmap.checksum}|${d.state && d.state.name}`;
      if (now !== signature) {
        signature = now;
        [200, 800, 2000].forEach(ms => setTimeout(refresh, ms));
      }
    };
    socket.onclose = () => setTimeout(connect, 2000);
  }

  connect();
  refresh();
  // Next in the app changes the pick with no event from tosu; never during play, when nothing here can change.
  setInterval(() => { if (live === null) refresh(); }, 2000);
</script>
</body>
</html>
